name: Release

# Push a version tag (for example v1.0.0) to build the pkg and attach it to a GitHub Release.
# Run it by hand from the Actions tab to just build the pkg and download it as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build-pkg:
    # Apple Silicon. macos-15 has a bigger runner pool than macos-26 (jobs there sat queued until
    # GitHub cancelled them) and ships Xcode 26.x, which the .icon app icon format needs.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      # Unsigned for now: the app is ad-hoc signed and the pkg is unsigned.
      # To sign and notarize later, import your Developer ID certificates into a temporary
      # keychain here and export APP_IDENTITY, PKG_IDENTITY and NOTARY_PROFILE before this step.
      - name: Build pkg
        run: ./scripts/build_pkg.sh

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(ls build/*.pkg)
          EXPECTED="TripleEspresso-${GITHUB_REF_NAME#v}.pkg"
          if [[ "$(basename "$PKG")" != "$EXPECTED" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the built version ($(basename "$PKG"))."
            echo "Update MARKETING_VERSION in the Xcode project, or push a matching tag."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TripleEspresso-pkg
          path: build/*.pkg

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.pkg --title "Triple Espresso ${GITHUB_REF_NAME#v}" --generate-notes
